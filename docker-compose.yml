# IMPORTANT: docker-compose.yaml uses .env file for its variables.

services:
  silkaraserver:
    image: ${DOCKER_REGISTRY-}silkaraserver
    container_name: silkaraserver
    build:
      context: .
      dockerfile: SikaraServer/Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - redis

    # Docker Compose just takes it and drops it inside the container so your C# code can read it.
    env_file:
      - .env.dev # or .env.prod
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - SERVER_IP_ADDRESS=${SERVER_IP_ADDRESS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USER=default
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  redis:
    image: redis:alpine
    container_name: silkara_redis
    # Using protected mode and ACL directly in the startup command
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    # Limiting container resources (DoS/memory leak protection)
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
